name: 로또 공식 자동 탐색

# 필요할 때만 Actions 화면에서 직접 실행. 새 공식을 유전 알고리즘으로 수천 개 시험하고, 좋은 것을 후보 풀에 넣는다.
# 후보 풀은 토요일 주간 학습에서 발견 이후 성적으로 챔피언과 겨룬다.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: '탐색 시간, 분'
        required: false
        default: '25'

permissions:
  contents: write

concurrency:
  group: lotto-state
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet "numpy>=2.0,<3" "pandas>=2.2" "scikit-learn>=1.4"
      - name: 공식 탐색
        env:
          MINUTES: ${{ github.event.inputs.minutes || '25' }}
        run: python lotto_bot/search.py --minutes "$MINUTES"
      - name: 후보 풀 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto_bot/state/search_pool.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "로또 공식 자동 탐색 기록"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
