name: 로또 주간 자동 학습

# 로또 토 20:35 KST 추첨 뒤 여러 번 실행. 이미 보낸 회차면 바로 끝난다.
# 새 결과가 있으면: 공식 15분 탐색 → 후보 전체 채점·챔피언 교체 판단 → 텔레그램에 상위 10개 숫자 + 문제·개선 정리 엑셀
on:
  schedule:
    - cron: '20 12 * * 6'   # 토 21:20 KST
    - cron: '20 13 * * 6'   # 토 22:20 KST
    - cron: '20 14 * * 6'   # 토 23:20 KST
    - cron: '20 0 * * 0'    # 일 09:20 KST
    - cron: '20 12 * * 0'   # 일 21:20 KST
  workflow_dispatch:
    inputs:
      force:
        description: '마지막 회차를 다시 보내려면 yes'
        required: false
        default: ''
      search_minutes:
        description: '결과마다 공식 탐색 시간, 분'
        required: false
        default: '15'
  push:
    paths:
      - lotto_bot/*.py
      - .github/workflows/lotto-weekly.yml

permissions:
  contents: write

concurrency:
  group: lotto-state
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet "numpy>=2.0,<3" "pandas>=2.2" "scikit-learn>=1.4" "scipy>=1.11" "networkx>=3" "openpyxl>=3.1"
      - name: 후보 모듈 불러오기 점검
        run: python -c "import sys; sys.path.insert(0,'lotto_bot'); import charts as CH, report; print(len(CH.names()), '후보')"
      - name: 새 회차 탐색·채점·후보 10개·엑셀·텔레그램 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
          LOTTO_SEARCH_MINUTES: ${{ github.event.inputs.search_minutes || '15' }}
        run: |
          if [ "$FORCE" = "yes" ]; then python lotto_bot/run_lotto.py --force; else python lotto_bot/run_lotto.py; fi
      - name: 학습 기록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto_bot/state lotto_bot/results 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "로또 자동 학습 기록"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
